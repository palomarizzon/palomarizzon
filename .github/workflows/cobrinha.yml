name: Generate Datas

on:
  schedule:
    - cron: "0 */12 * * *" # Corrigido para rodar a cada 12 horas exatas
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Versão atualizada da Action da Cobrinha
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: palomarizzon
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Envia os arquivos para a branch 'output'
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
